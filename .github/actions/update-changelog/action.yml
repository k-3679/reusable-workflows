name: Update changelog
description: Move the Unreleased section of a Keep a Changelog-formatted CHANGELOG.md into a new version section and update the compare links

inputs:
  changelog-file:
    description: Path to a Keep a Changelog-formatted CHANGELOG.md (skipped if the file doesn't exist)
    required: false
    default: "CHANGELOG.md"
  new-version:
    description: The new semantic version (without the leading "v")
    required: true
  new-tag:
    description: The git tag for this release
    required: true
  release-date:
    description: The release date (YYYY-MM-DD)
    required: true
  repo-url:
    description: The repository URL, used to build compare links
    required: true
  fail-on-empty:
    description: Fail this step if the [Unreleased] section has no entries instead of releasing an empty version section
    required: false
    default: "false"

outputs:
  updated:
    description: Whether the changelog file was found and updated
    value: ${{ steps.changelog.outputs.updated }}

runs:
  using: composite
  steps:
    - name: Update changelog
      id: changelog
      shell: bash
      env:
        CHANGELOG_FILE: ${{ inputs.changelog-file }}
        NEW_VERSION: ${{ inputs.new-version }}
        NEW_TAG: ${{ inputs.new-tag }}
        RELEASE_DATE: ${{ inputs.release-date }}
        REPO_URL: ${{ inputs.repo-url }}
        FAIL_ON_EMPTY: ${{ inputs.fail-on-empty }}
      run: |
        if [ ! -f "$CHANGELOG_FILE" ]; then
          echo "::notice::No $CHANGELOG_FILE found, skipping changelog update"
          echo "updated=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        updated=$(python3 - <<'PYEOF'
        import os, re, sys

        changelog_file = os.environ["CHANGELOG_FILE"]
        new_version = os.environ["NEW_VERSION"]
        new_tag = os.environ["NEW_TAG"]
        release_date = os.environ["RELEASE_DATE"]
        repo_url = os.environ["REPO_URL"]
        fail_on_empty = os.environ["FAIL_ON_EMPTY"].strip().lower() == "true"

        with open(changelog_file, "r", encoding="utf-8") as f:
            content = f.read()

        pattern = re.compile(r"(## \[Unreleased\]\n)(.*?)(?=\n## \[|\Z)", re.DOTALL)
        match = pattern.search(content)
        if not match:
            print(f"::warning::Could not find an '## [Unreleased]' section in {changelog_file}, skipping changelog update", file=sys.stderr)
            print("false")
            sys.exit(0)

        unreleased_body = match.group(2).strip("\n")

        if not unreleased_body:
            if fail_on_empty:
                print(f"::error::[Unreleased] section in {changelog_file} is empty, refusing to release {new_tag} with no changelog entries", file=sys.stderr)
                print("false")
                sys.exit(1)
            print(f"::warning::[Unreleased] section in {changelog_file} is empty, releasing {new_tag} with no changelog entries", file=sys.stderr)

        new_section = f"## [Unreleased]\n\n## [{new_version}] - {release_date}\n"
        if unreleased_body:
            new_section += f"\n{unreleased_body}\n"

        content = content[:match.start()] + new_section + content[match.end():]

        prev_tag_match = re.search(r"^\[unreleased\]: .*/compare/(v[\w.\-]+)\.\.\.HEAD", content, re.MULTILINE)
        prev_tag = prev_tag_match.group(1) if prev_tag_match else None

        new_links = f"[unreleased]: {repo_url}/compare/{new_tag}...HEAD\n"
        if prev_tag:
            new_links += f"[{new_version}]: {repo_url}/compare/{prev_tag}...{new_tag}\n"
        else:
            new_links += f"[{new_version}]: {repo_url}/releases/tag/{new_tag}\n"

        if prev_tag_match:
            content = content[:prev_tag_match.start()] + new_links + content[prev_tag_match.end():]
        else:
            content = content.rstrip("\n") + "\n\n" + new_links

        with open(changelog_file, "w", encoding="utf-8") as f:
            f.write(content)

        print("true")
        PYEOF
        )
        py_status=$?
        echo "updated=$updated" >> "$GITHUB_OUTPUT"
        exit "$py_status"
