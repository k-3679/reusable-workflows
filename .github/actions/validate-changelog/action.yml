name: Validate changelog
description: Fail unless the [Unreleased] section of a Keep a Changelog-formatted CHANGELOG.md was updated by this push and every entry sits under a valid category (Added, Changed, Deprecated, Removed, Fixed, Security) as a '- ' bullet of at least three words

inputs:
  changelog-file:
    description: Path to a Keep a Changelog-formatted CHANGELOG.md
    required: false
    default: "CHANGELOG.md"
  base-sha:
    description: The "before" commit to diff against. Empty falls back to merge-base with default-branch
    required: false
    default: ""
  default-branch:
    description: Branch to fall back to for merge-base when base-sha is unusable
    required: false
    default: "main"

runs:
  using: composite
  steps:
    - name: Check Unreleased section was updated
      shell: bash
      env:
        CHANGELOG_FILE: ${{ inputs.changelog-file }}
        BASE_SHA: ${{ inputs.base-sha }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
      run: |
        if [ ! -f "$CHANGELOG_FILE" ]; then
          echo "::error::$CHANGELOG_FILE not found"
          exit 1
        fi
        
        effective_base="$BASE_SHA"
        if [ -z "$effective_base" ] || [ "$effective_base" = "0000000000000000000000000000000000000000" ]; then
          effective_base=""
        fi

        # Verify that effective base is a 
        # - valid commit.
        # - that exists in the commit history.
        if [ -n "$effective_base" ] && ! git cat-file -e "${effective_base}^{commit}" 2>/dev/null; then
          echo "::warning::base commit $effective_base not found in history, falling back to merge-base with $DEFAULT_BRANCH"
          effective_base=""
        fi
 
        # Fall back to merge-base (shared commit) with the default branch
        if [ -z "$effective_base" ]; then
          git fetch origin "$DEFAULT_BRANCH" --quiet 2>/dev/null || true
          effective_base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true)
        fi

        # Diff current and effective base changelog
        EFFECTIVE_BASE_SHA="$effective_base" python3 "$GITHUB_ACTION_PATH/validate_changelog.py"
